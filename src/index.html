<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KOMA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Set the theme before first paint so there is no light/dark flash.
    (function () {
      var mode = null;
      try { mode = localStorage.getItem('koma.theme'); } catch (e) {}
      var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
